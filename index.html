<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Watch: Emergency Response</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
        }
        #fullscreen-btn:hover {
            opacity: 1.0;
            transform: scale(1.1);
        }
        /* Loading Screen Overlay */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease-out;
            color: #38bdf8;
            font-family: monospace;
        }
        .loading-title {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            text-align: center;
        }
        .loading-subtitle {
            font-size: 36px;
            color: #9ca3af;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
        }
        .progress-bar-container {
            width: 320px;
            height: 6px;
            background: #1f2937;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #374151;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 10px #38bdf8;
        }
        #loading-status {
            margin-top: 15px;
            font-size: 13px;
            color: #cbd5e1;
            letter-spacing: 1px;
        }
    </style>
    <!-- Import map for Three.js and addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Loading Screen Overlay -->
    <div id="loading-screen">
        <div class="loading-title">Wind Watch</div>
        <div class="loading-subtitle">Emergency Response</div>
        <div class="progress-bar-container">
            <div id="loading-progress"></div>
        </div>
        <div id="loading-status">Initializing systems...</div>
    </div>

    <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 10L3 3"></path>
            <path d="M3 9V3h6"></path>
            <path d="M14 10l7-7"></path>
            <path d="M15 3h6v6"></path>
            <path d="M10 14l-7 7"></path>
            <path d="M3 15v6h6"></path>
            <path d="M14 14l7 7"></path>
            <path d="M21 15v6h-6"></path>
        </svg>
    </button>

    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
